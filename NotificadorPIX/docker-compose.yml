services:
  notificador-pix:
    image: notificador-pix:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: notificador-pix
    restart: unless-stopped
    ports:
      - "3013:3013"
    env_file:
      - .env
    environment:
      CERT_DIR: C:/certs
    volumes:
      # Pasta inteira (nao so o codigo copiado na imagem): restart via
      # supervisor pega o que estiver salvo no disco na hora, sem rebuild.
      - C:/Projetos/Confirmacao_Pix/NotificadorPIX:C:/app
      - C:/Projetos/Certificados:C:/certs:ro
